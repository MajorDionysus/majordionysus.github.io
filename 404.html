<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - Page Not Found</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
      color: #eceff4;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      flex-direction: column;
    }
    h1 {
      font-size: 10rem;
      margin: 0;
      display: flex;
    }
    h1 .letter {
      display: inline-block;
      position: relative;
      margin: 0 0.2rem;
      opacity: 0;
    }
    #message {
      font-size: 1.5rem;
      margin-top: 1rem;
      opacity: 0;
      text-shadow: 0 0 5px rgba(236,239,244,0.7);
    }
    #home-button {
      margin-top: 2rem;
      padding: 0.75rem 2rem;
      font-size: 1rem;
      font-weight: bold;
      background: linear-gradient(135deg, #3a3f4b, #585e6f);
      border: none;
      border-radius: 2rem;
      cursor: pointer;
      color: #ffffff;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      opacity: 0;
      transform: scale(0.9);
    }
    #home-button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    .shape {
      position: absolute;
      border-radius: 50%;
      opacity: 0.08;
      mix-blend-mode: normal;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <h1 id="animated-404">
    <span class="letter">4</span><span class="letter">0</span><span class="letter">4</span>
  </h1>
  <p id="message">Oops! The page you're looking for doesn't exist.</p>
  <button id="home-button" onclick="location.href='index.html'">Return Home</button>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <script>
    var letters = document.querySelectorAll('#animated-404 .letter');
    var message = document.getElementById('message');
    var button = document.getElementById('home-button');

    var palette = ['#E3B23C', '#D77FA1', '#9AC5A1', '#7B9EA8', '#C49B5A'];
    for (var i = 0; i < 25; i++) {
      var div = document.createElement('div');
      div.classList.add('shape');
      var size = anime.random(30, 120);
      div.style.width = div.style.height = size + 'px';
      div.style.background = palette[anime.random(0, palette.length - 1)];
      div.style.top = anime.random(0, 100) + 'vh';
      div.style.left = anime.random(0, 100) + 'vw';
      document.body.appendChild(div);
      anime({
        targets: div,
        translateX: function() { return anime.random(-300, 300); },
        translateY: function() { return anime.random(-300, 300); },
        scale: [1, 0.2],
        opacity: [0.2, 0],
        easing: 'easeInOutSine',
        duration: anime.random(3000, 6000),
        loop: true,
        direction: 'alternate'
      });
    }

    var introTl = anime.timeline({ loop: false });
    introTl
      .add({
        targets: letters,
        translateY: [100, 0],
        rotate: [180, 0],
        opacity: [0, 1],
        color: function() { return palette[anime.random(0, palette.length - 1)]; },
        easing: 'easeOutExpo',
        duration: 1000,
        delay: (el, i) => i * 200
      })
      .add({
        targets: message,
        opacity: [0, 1],
        translateY: [30, 0],
        easing: 'easeOutExpo',
        duration: 800
      }, '-=600')
      .add({
        targets: button,
        opacity: [0, 1],
        scale: [0.9, 1],
        easing: 'easeOutBack',
        duration: 800
      }, '-=500');

    anime({
      targets: '#animated-404',
      translateX: [0, 10],
      translateY: [0, -10],
      direction: 'alternate',
      easing: 'easeInOutSine',
      duration: 4000,
      loop: true
    });
  </script>
</body>
</html>
