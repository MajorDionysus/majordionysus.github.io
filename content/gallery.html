<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f2e9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1714" media="(prefers-color-scheme: dark)">
  <title>Gallery · Renjie Mei</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://mrj2026.today">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/phone.css">
  <link rel="stylesheet" href="../assets/css/elegant.css">
  <link rel="stylesheet" href="../assets/css/raw.css?v=10">
  <script src="../assets/js/theme-init.js"></script>
  <script src="../assets/js/site-core.js?v=4" defer></script>
  <script src="../assets/js/elegant.js" defer></script>
  <script src="../assets/js/site-pages.js?v=6" defer></script>
</head>
<body data-page="gallery" data-root="../">
  <header id="site-header"></header>
  <main class="page">
    <div class="page-inner">
      <div class="gallery-header page-title-block anim">
        <h1 style="margin-bottom:0.4rem">Gallery</h1>
        <p style="color:var(--text-3);font-size:0.95rem">Editorial albums — one story at a time.</p>
        <div class="gallery-tabs" id="galleryChapterTabs"></div>
      </div>

      <div class="gallery-stage anim anim-d1" id="galleryViewer">
        <button class="gallery-arrow gallery-arrow-prev" id="galleryPrev" aria-label="Previous">←</button>
        <img id="galleryMainImg" alt="">
        <button class="gallery-arrow gallery-arrow-next" id="galleryNext" aria-label="Next">→</button>
        <div class="gallery-caption-bar">
          <span class="gallery-counter" id="galleryCounter"></span>
          <span class="gallery-caption" id="galleryCaption"></span>
          <button class="gallery-fs-btn" id="galleryFsBtn" aria-label="Fullscreen">⛶</button>
        </div>
      </div>

      <div class="gallery-strip" id="galleryStrip"></div>

      <footer class="footer">
        <div class="footer-inner">
          <p class="footer-copy">© 2026 Renjie Mei</p>
          <p class="footer-tagline">// stay curious</p>
        </div>
      </footer>
    </div>
  </main>

  <div class="gallery-fs" id="galleryFsOverlay">
    <button class="gallery-fs-close" id="galleryFsClose" aria-label="Close">×</button>
    <button class="gallery-fs-arrow gallery-fs-prev" id="galleryFsPrev" aria-label="Previous">←</button>
    <img class="gallery-fs-img" id="galleryFsImg" alt="">
    <button class="gallery-fs-arrow gallery-fs-next" id="galleryFsNext" aria-label="Next">→</button>
    <div class="gallery-fs-caption" id="galleryFsCaption"></div>
  </div>

</body>
</html>
